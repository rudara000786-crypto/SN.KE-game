<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nila Cobra - Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #4E7CF6;
            --emerald-light: #A2D149;
            --emerald-dark: #AAD751;
            --danger: #E74C3C;
        }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #1a2e05;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background-color: #578A34;
        }
        canvas { 
            display: block; 
            margin-top: 60px; 
            border-radius: 4px;
        }
        
        #nav {
            position: absolute; top: 0; width: 100%; height: 60px;
            background: #4A7C2C; display: flex; align-items: center;
            justify-content: space-between; padding: 0 15px; z-index: 50;
        }
        .score-box {
            background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 20px;
            display: flex; align-items: center; gap: 6px; color: white; font-weight: bold;
        }
        #pause-btn {
            background: rgba(255,255,255,0.2); width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            border: none; outline: none;
        }

        .overlay {
            position: absolute; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .card {
            background: #fff; border-radius: 32px; padding: 25px; width: 90%; max-width: 380px;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            pointer-events: auto;
        }

        .play-btn {
            background: var(--primary); color: white; width: 100%; padding: 16px;
            border-radius: 20px; font-size: 1.25rem; font-weight: 800;
            margin-top: 15px; border: none; cursor: pointer;
            box-shadow: 0 4px 0 #2b55c7; transition: active 0.1s;
        }
        .play-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #2b55c7; }
        
        .secondary-btn {
            background: #f1f5f9; color: #475569; width: 100%; padding: 12px;
            border-radius: 20px; font-size: 0.9rem; font-weight: 700;
            margin-top: 10px; border: 2px solid #e2e8f0; cursor: pointer;
        }

        .selection-grid {
            display: grid; grid-template-cols: 1fr 1fr; gap: 10px; margin: 15px 0;
        }
        .mode-tile {
            background: #f8fafc; padding: 15px 5px; border-radius: 16px; 
            border: 2px solid #e2e8f0; cursor: pointer;
            display: flex; flex-direction: column; align-items: center;
        }
        .mode-tile .status-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1;
            margin-bottom: 8px;
        }
        .mode-tile.active { background: #eff6ff; border-color: var(--primary); }
        .mode-tile.active .status-dot { background: var(--primary); }
        .mode-tile.active .label { color: var(--primary); }
        .label { font-size: 0.75rem; font-weight: 800; color: #64748b; text-transform: uppercase; }
        
        .stat-badge {
            background: #f8fafc; border-radius: 16px; padding: 12px;
            margin-bottom: 15px; display: flex; justify-content: space-around;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="nav" class="hidden">
            <div class="score-box"><span>🍎</span><span id="score-text">0</span></div>
            <div id="mod-indicator" class="text-white/80 font-bold text-[9px] tracking-widest uppercase flex gap-2"></div>
            <button id="pause-btn" onclick="togglePause()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- Main Menu -->
        <div id="menu" class="overlay">
            <div class="card">
                <div class="mb-2">
                    <h1 class="text-3xl font-black mb-0 tracking-tighter text-emerald-600 italic">NILA COBRA</h1>
                    <p class="text-[9px] font-bold text-gray-400 tracking-[0.3em] uppercase">SK GAME'S PRODUCTION</p>
                </div>
                
                <div class="selection-grid">
                    <div id="m-classic" class="mode-tile active" onclick="toggleMode('classic')">
                        <div class="status-dot"></div><div class="label">Classic</div>
                    </div>
                    <div id="m-zen" class="mode-tile" onclick="toggleMode('zen')">
                        <div class="status-dot"></div><div class="label">Zen</div>
                    </div>
                    <div id="m-portal" class="mode-tile" onclick="toggleMode('portal')">
                        <div class="status-dot"></div><div class="label">Portals</div>
                    </div>
                    <div id="m-hunter" class="mode-tile" onclick="toggleMode('hunter')">
                        <div class="status-dot"></div><div class="label">Hunter</div>
                    </div>
                </div>

                <button class="play-btn" onclick="startNewGame()">START MISSION</button>
            </div>
        </div>

        <!-- Game Over -->
        <div id="game-over" class="overlay hidden">
            <div class="card">
                <h1 class="text-3xl font-black mb-1 text-red-600 italic">CRASHED!</h1>
                <div class="stat-badge">
                    <div class="flex flex-col"><span id="final-score" class="text-xl font-bold">0</span><span class="text-[10px] uppercase text-gray-400">Score</span></div>
                    <div class="flex flex-col border-l border-gray-200 pl-8"><span id="best-score" class="text-xl font-bold">0</span><span class="text-[10px] uppercase text-gray-400">Best</span></div>
                </div>
                <button class="play-btn" onclick="goToMenu()">MAIN MENU</button>
                <button class="secondary-btn" onclick="startNewGame()">QUICK RESTART</button>
            </div>
        </div>

        <!-- Pause -->
        <div id="pause-menu" class="overlay hidden">
            <div class="card">
                <h1 class="text-3xl font-black mb-6 text-blue-600 italic">PAUSED</h1>
                <button class="play-btn" onclick="togglePause()">RESUME</button>
                <button class="secondary-btn" onclick="goToMenu()">QUIT</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const gameOverScreen = document.getElementById('game-over');
        const pauseMenu = document.getElementById('pause-menu');
        const nav = document.getElementById('nav');
        const scoreDisplay = document.getElementById('score-text');
        const modIndicator = document.getElementById('mod-indicator');

        let gridX = 17, gridY, tSize;
        let snake = [], hunter = [], apple = {x:0, y:0}, portals = [];
        let dir = {x:1, y:0}, nextDir = {x:1, y:0};
        let hDir = {x:0, y:1};
        let score = 0, bestScore = 0, active = false, paused = false;
        let portalTimer = 0;
        let mods = { classic: true, zen: false, portal: false, hunter: false };

        function toggleMode(m) {
            if (m === 'classic') {
                mods = { classic: true, zen: false, portal: false, hunter: false };
            } else {
                mods.classic = false;
                mods[m] = !mods[m];
                if (!mods.zen && !mods.portal && !mods.hunter) mods.classic = true;
            }
            updateModeUI();
        }

        function updateModeUI() {
            ['classic', 'zen', 'portal', 'hunter'].forEach(key => {
                const el = document.getElementById('m-' + key);
                if (mods[key]) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function togglePause() {
            if (!active) return;
            paused = !paused;
            pauseMenu.classList.toggle('hidden', !paused);
        }

        function goToMenu() {
            active = false; paused = false;
            gameOverScreen.classList.add('hidden');
            pauseMenu.classList.add('hidden');
            nav.classList.add('hidden');
            menu.classList.remove('hidden');
        }

        function setupGrid() {
            const dpr = window.devicePixelRatio || 1;
            const screenW = window.innerWidth;
            const screenH = window.innerHeight - 60;
            tSize = Math.floor(screenW / 17); 
            gridX = 17;
            gridY = Math.floor(screenH / tSize);
            canvas.width = gridX * tSize * dpr;
            canvas.height = gridY * tSize * dpr;
            canvas.style.width = (gridX * tSize) + 'px';
            canvas.style.height = (gridY * tSize) + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function startNewGame() {
            setupGrid();
            const sx = Math.floor(gridX/2), sy = Math.floor(gridY/2);
            snake = [{x: sx, y: sy}, {x: sx-1, y: sy}, {x: sx-2, y: sy}];
            dir = nextDir = {x:1, y:0};
            score = 0; scoreDisplay.innerText = "0";
            portalTimer = 0; portals = []; hunter = [];

            if (mods.hunter) {
                hunter = [{x: 0, y: 0}, {x: 0, y: 1}, {x: 0, y: 2}];
                hDir = {x:0, y:1};
            }
            
            modIndicator.innerHTML = Object.keys(mods).filter(k => mods[k]).map(k => `<span>${k}</span>`).join('•');

            menu.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            pauseMenu.classList.add('hidden');
            nav.classList.remove('hidden');
            active = true; paused = false;
            spawnApple();
            if (mods.portal) spawnPortals();
        }

        function spawnPortals() {
            const spots = [];
            for(let x=0; x<gridX; x++) {
                for(let y=0; y<gridY; y++) {
                    if(!snake.some(s=>s.x===x&&s.y===y)&&(apple.x!==x||apple.y!==y)) spots.push({x,y});
                }
            }
            spots.sort(() => Math.random() - 0.5);
            portals = [];
            const cols = ['rgba(255,255,255,0.7)', 'rgba(78,124,246,0.7)', 'rgba(255,255,255,0.4)'];
            for(let i=0; i<3; i++) {
                if(spots[i*2] && spots[i*2+1]) {
                    portals.push({x:spots[i*2].x, y:spots[i*2].y, target:i*2+1, c:cols[i]});
                    portals.push({x:spots[i*2+1].x, y:spots[i*2+1].y, target:i*2, c:cols[i]});
                }
            }
        }

        function spawnApple() {
            const spots = [];
            for(let x=0; x<gridX; x++) {
                for(let y=0; y<gridY; y++) {
                    const occ = snake.some(s=>s.x===x&&s.y===y) || (mods.hunter && hunter.some(h=>h.x===x&&h.y===y)) || portals.some(p=>p.x===x&&p.y===y);
                    if(!occ) spots.push({x,y});
                }
            }
            if(spots.length) apple = spots[Math.floor(Math.random()*spots.length)];
        }

        function die() {
            active = false;
            if (score > bestScore) bestScore = score;
            document.getElementById('final-score').innerText = score;
            document.getElementById('best-score').innerText = bestScore;
            gameOverScreen.classList.remove('hidden');
        }

        let touchStart = {x:0, y:0};
        document.addEventListener('touchstart', e => {
            // Only capture touches on canvas to prevent blocking buttons
            if (e.target.tagName !== 'BUTTON' && e.target.closest('.card') === null) {
                touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY};
            }
        }, {passive: true});

        document.addEventListener('touchend', e => {
            if(!active || paused || touchStart.x === 0) return;
            const dx = e.changedTouches[0].clientX - touchStart.x;
            const dy = e.changedTouches[0].clientY - touchStart.y;
            if(Math.abs(dx) > 30 || Math.abs(dy) > 30) {
                if(Math.abs(dx) > Math.abs(dy)) {
                    if(dir.x === 0) nextDir = {x: dx > 0 ? 1 : -1, y: 0};
                } else {
                    if(dir.y === 0) nextDir = {x: 0, y: dy > 0 ? 1 : -1};
                }
            }
            touchStart = {x:0, y:0};
        }, {passive: true});

        // Keyboard support
        window.addEventListener('keydown', e => {
            if(!active || paused) return;
            if(e.key === 'ArrowUp' && dir.y === 0) nextDir = {x:0, y:-1};
            if(e.key === 'ArrowDown' && dir.y === 0) nextDir = {x:0, y:1};
            if(e.key === 'ArrowLeft' && dir.x === 0) nextDir = {x:-1, y:0};
            if(e.key === 'ArrowRight' && dir.x === 0) nextDir = {x:1, y:0};
        });

        function update() {
            dir = {...nextDir};
            let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            if (mods.portal) {
                portalTimer += 130; if (portalTimer >= 5000) { spawnPortals(); portalTimer = 0; }
            }

            if(head.x < 0 || head.x >= gridX || head.y < 0 || head.y >= gridY) {
                if(mods.zen) {
                    if(head.x < 0) head.x = gridX-1; else if(head.x >= gridX) head.x = 0;
                    if(head.y < 0) head.y = gridY-1; else if(head.y >= gridY) head.y = 0;
                } else return die();
            }

            if(!mods.zen && snake.some(s => s.x === head.x && s.y === head.y)) return die();
            if(mods.hunter && hunter.some(h => h.x === head.x && h.y === head.y)) return die();

            if (mods.portal) {
                for(let i=0; i<portals.length; i++) {
                    if(head.x===portals[i].x && head.y===portals[i].y) {
                        const ex = portals[portals[i].target]; head.x = ex.x; head.y = ex.y; break;
                    }
                }
            }

            if(mods.hunter) {
                let hH = hunter[0];
                let moves = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
                moves.forEach(m => {
                    let nx = hH.x+m.x, ny = hH.y+m.y;
                    if(mods.zen) {
                        if(nx<0) nx=gridX-1; else if(nx>=gridX) nx=0;
                        if(ny<0) ny=gridY-1; else if(ny>=gridY) ny=0;
                    }
                    if(mods.portal) {
                        for(let p of portals) { if(nx===p.x && ny===p.y) { const d=portals[p.target]; nx=d.x; ny=d.y; break; } }
                    }
                    m.nx = nx; m.ny = ny;
                    m.s = Math.abs(head.x-nx) + Math.abs(head.y-ny);
                    if(snake.some(s=>s.x===nx && s.y===ny)) m.s += 1000;
                    if(hunter.some(h=>h.x===nx && h.y===ny)) m.s += 500;
                    if(!mods.zen && (nx<0 || nx>=gridX || ny<0 || ny>=gridY)) m.s += 2000;
                });
                moves.sort((a,b)=>a.s-b.s);
                let bm = moves[0]; hDir = {x:bm.x, y:bm.y};
                hunter.unshift({x:bm.nx, y:bm.ny}); hunter.pop();
                if(bm.nx===head.x && bm.ny===head.y) return die();
            }

            snake.unshift(head);
            if(head.x === apple.x && head.y === apple.y) {
                score++; scoreDisplay.innerText = score; spawnApple();
            } else snake.pop();
        }

        function drawSnake(segs, col, d) {
            segs.forEach((s, i) => {
                ctx.fillStyle = col;
                ctx.fillRect(s.x*tSize, s.y*tSize, tSize, tSize);
                if(i === 0) {
                    const os = tSize*0.28, is = os*0.5, off = tSize*0.12;
                    let e1={x:0,y:0}, e2={x:0,y:0};
                    if(d.x!==0) { e1.x = s.x*tSize+(d.x===1?tSize*0.55:tSize*0.1); e1.y=s.y*tSize+off; e2.x=e1.x; e2.y=s.y*tSize+tSize-off-os; }
                    else { e1.x=s.x*tSize+off; e1.y=s.y*tSize+(d.y===1?tSize*0.55:tSize*0.1); e2.x=s.x*tSize+tSize-off-os; e2.y=e1.y; }
                    ctx.fillStyle='white'; ctx.fillRect(e1.x,e1.y,os,os); ctx.fillRect(e2.x,e2.y,os,os);
                    ctx.fillStyle='black';
                    let px=(d.x===1)?is:(d.x===-1)?0:is/2, py=(d.y===1)?is:(d.y===-1)?0:is/2;
                    ctx.fillRect(e1.x+px,e1.y+py,is,is); ctx.fillRect(e2.x+px,e2.y+py,is,is);
                }
            });
        }

        function draw() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            for(let y=0; y<gridY; y++) {
                for(let x=0; x<gridX; x++) {
                    ctx.fillStyle = (x+y)%2===0 ? '#A2D149' : '#AAD751';
                    ctx.fillRect(x*tSize, y*tSize, tSize, tSize);
                }
            }
            portals.forEach(p => {
                ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x*tSize+tSize/2, p.y*tSize+tSize/2, tSize*0.4, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = 'white'; ctx.lineWidth = 1; ctx.stroke();
            });
            const ax=apple.x*tSize+tSize/2, ay=apple.y*tSize+tSize/2, r=tSize*0.42;
            ctx.fillStyle='#E74C3C'; ctx.beginPath(); ctx.arc(ax,ay+2,r,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#2ECC71'; ctx.beginPath(); ctx.ellipse(ax+r/2,ay-r,r/3,r/2,0.8,0,Math.PI*2); ctx.fill();
            if(mods.hunter) drawSnake(hunter, '#E74C3C', hDir);
            drawSnake(snake, '#4E7CF6', dir);
        }

        let lastTime = 0;
        function loop(t) {
            if(active && !paused) {
                if(!lastTime) lastTime = t;
                if(t - lastTime > 135) { update(); lastTime = t; }
            } else { lastTime = 0; }
            draw();
            requestAnimationFrame(loop);
        }

        window.onload = () => { setupGrid(); requestAnimationFrame(loop); };
        window.onresize = setupGrid;
    </script>
</body>
</html>
